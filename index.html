
<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vendom Payment</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    #qr {
      margin: 20px auto;
    }

    #qr img {
      width: 300px;
      max-width: 90%;
    }

  </style>

</head>

<body>

  <h1>Vendom</h1>

  <h2 id="product">Loading product...</h2>

  <h2 id="price"></h2>

  <p id="status">
    Creating payment...
  </p>

  <div id="qr"></div>


  <script>

    // =================================
    // CLOUDFLARE WORKER
    // =================================

    const WORKER_URL =
      "https://vendom-paymongo.vendom427.workers.dev";


    // =================================
    // GET PRODUCT FROM URL
    // =================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productId =
      params.get("product");


    // =================================
    // CREATE PAYMENT
    // =================================

    async function createPayment() {

      try {

        if (!productId) {

          document.getElementById(
            "status"
          ).textContent =
            "No product selected.";

          return;
        }


        // =================================
        // STEP 1
        // CREATE PAYMENT
        // =================================

        const createResponse =
          await fetch(
            `${WORKER_URL}/create-payment`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                productId:
                  productId
              })
            }
          );


        const createData =
          await createResponse.json();


        console.log(
          "Create payment:",
          createData
        );


        if (!createResponse.ok) {

          throw new Error(
            createData.error ||
            "Failed to create payment"
          );
        }


        // =================================
        // PRODUCT
        // =================================

        const product =
          createData.product;


        document.getElementById(
          "product"
        ).textContent =
          product.name;


        document.getElementById(
          "price"
        ).textContent =
          "₱" + product.price;


        // =================================
        // PAYMENT INTENT
        // =================================

        const paymentIntent =
          createData.data;


        const paymentIntentId =
          paymentIntent.id;


        const clientKey =
          paymentIntent.attributes.client_key;


        // =================================
        // STEP 2
        // ATTACH QR
        // =================================

        const attachResponse =
          await fetch(
            `${WORKER_URL}/attach-qr`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                paymentIntentId:
                  paymentIntentId,

                clientKey:
                  clientKey

              })
            }
          );


        const attachData =
          await attachResponse.json();


        console.log(
          "Attach QR:",
          attachData
        );


        if (!attachResponse.ok) {

          throw new Error(
            attachData.error ||
            "Failed to attach QR"
          );
        }


        // =================================
        // STEP 3
        // GET QR IMAGE
        // =================================

        const qrImage =
          attachData.data.attributes
            .next_action.code.image_url;


        // =================================
        // STEP 4
        // DISPLAY QR
        // =================================

        document.getElementById(
          "qr"
        ).innerHTML =
          `<img
            src="${qrImage}"
            alt="Pay ₱${product.price}"
          >`;


        document.getElementById(
          "status"
        ).textContent =
          "Scan this QR code to pay.";


        // =================================
        // STEP 5
        // CHECK PAYMENT
        // =================================

        const checkPayment =
          setInterval(
            async () => {

              try {

                const response =
                  await fetch(
                    `${WORKER_URL}/check-payment`,
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                      body: JSON.stringify({

                        paymentIntentId:
                          paymentIntentId

                      })
                    }
                  );


                const data =
                  await response.json();


                const status =
                  data?.data?.attributes?.status;


                console.log(
                  "Payment status:",
                  status
                );


                // =================================
                // PAYMENT SUCCESS
                // =================================

                if (
                  status === "succeeded"
                ) {

                  clearInterval(
                    checkPayment
                  );


                  document.getElementById(
                    "status"
                  ).textContent =
                    "Payment successful!";


                  document.getElementById(
                    "qr"
                  ).innerHTML =
                    "";


                  // Firebase payment record
                  // has already been created
                  // by the Cloudflare Worker.

                }

              } catch (error) {

                console.error(
                  "Payment check failed:",
                  error
                );

              }

            },
            3000
          );


      } catch (error) {

        console.error(
          error
        );


        document.getElementById(
          "status"
        ).textContent =
          "Failed to create payment: " +
          error.message;
      }

    }


    // =================================
    // START
    // =================================

    createPayment();

  </script>

</body>
</html>
