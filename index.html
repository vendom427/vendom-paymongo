
<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vendom Payment</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #subtitle {
      margin-top: 0;
      color: #666;
    }

    #products {
      max-width: 500px;
      margin: 20px auto;
    }

    .product-button {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .product-button:hover {
      background: #eeeeee;
    }

    .product-name {
      display: block;
      margin-bottom: 5px;
    }

    .product-price {
      display: block;
      font-size: 16px;
      color: #333;
    }

    #payment {
      display: none;
      max-width: 500px;
      margin: 20px auto;
    }

    #qr {
      margin: 20px auto;
    }

    #qr img {
      width: 300px;
      max-width: 90%;
    }

    #backButton {
      display: none;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <h1>Vendom</h1>

  <p id="subtitle">
    Select a product to pay
  </p>


  <!-- ================================= -->
  <!-- PRODUCT SELECTION -->
  <!-- ================================= -->

  <div id="products">

    <p id="loading">
      Loading products...
    </p>

  </div>


  <!-- ================================= -->
  <!-- PAYMENT -->
  <!-- ================================= -->

  <div id="payment">

    <h2 id="product"></h2>

    <h2 id="price"></h2>

    <p id="status">
      Creating payment...
    </p>

    <div id="qr"></div>

    <button
      id="backButton"
      onclick="showProducts()"
    >
      Back to Products
    </button>

  </div>


  <script>

    // =================================
    // CLOUDFLARE WORKER
    // =================================

    const WORKER_URL =
      "https://vendom-paymongo.vendom427.workers.dev";


    // =================================
    // FIREBASE DATABASE
    // =================================

    const FIREBASE_URL =
      "https://vendom-9757f-default-rtdb.asia-southeast1.firebasedatabase.app";


    // =================================
    // PRODUCT LIST
    // =================================

    let products = {};


    // =================================
    // LOAD PRODUCTS
    // =================================

    async function loadProducts() {

      try {

        const response =
          await fetch(
            `${FIREBASE_URL}/products.json`
          );


        if (!response.ok) {

          throw new Error(
            "Could not load products"
          );

        }


        products =
          await response.json();


        console.log(
          "Products:",
          products
        );


        displayProducts();


      } catch (error) {

        console.error(
          error
        );


        document.getElementById(
          "loading"
        ).textContent =
          "Failed to load products.";

      }

    }


    // =================================
    // DISPLAY PRODUCTS
    // =================================

    function displayProducts() {

      const container =
        document.getElementById(
          "products"
        );


      container.innerHTML = "";


      for (
        const productId in products
      ) {

        const product =
          products[productId];


        const button =
          document.createElement(
            "button"
          );


        button.className =
          "product-button";


        button.innerHTML = `

          <span class="product-name">
            ${product.name}
          </span>

          <span class="product-price">
            ₱${product.price}
          </span>

        `;


        button.onclick =
          function() {

            createPayment(
              productId
            );

          };


        container.appendChild(
          button
        );

      }

    }


    // =================================
    // CREATE PAYMENT
    // =================================

    async function createPayment(
      productId
    ) {

      try {

        // Hide product list

        document.getElementById(
          "products"
        ).style.display =
          "none";


        document.getElementById(
          "subtitle"
        ).style.display =
          "none";


        document.getElementById(
          "payment"
        ).style.display =
          "block";


        document.getElementById(
          "status"
        ).textContent =
          "Creating payment...";


        document.getElementById(
          "qr"
        ).innerHTML =
          "";


        document.getElementById(
          "backButton"
        ).style.display =
          "none";


        // =================================
        // STEP 1
        // CREATE PAYMENT
        // =================================

        const createResponse =
          await fetch(
            `${WORKER_URL}/create-payment`,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                productId:
                  productId

              })

            }
          );


        const createData =
          await createResponse.json();


        console.log(
          "Create payment:",
          createData
        );


        if (!createResponse.ok) {

          throw new Error(
            createData.error ||
            "Failed to create payment"
          );

        }


        // =================================
        // PRODUCT
        // =================================

        const product =
          createData.product;


        document.getElementById(
          "product"
        ).textContent =
          product.name;


        document.getElementById(
          "price"
        ).textContent =
          "₱" + product.price;


        // =================================
        // PAYMENT INTENT
        // =================================

        const paymentIntent =
          createData.data;


        const paymentIntentId =
          paymentIntent.id;


        const clientKey =
          paymentIntent.attributes.client_key;


        // =================================
        // STEP 2
        // ATTACH QR
        // =================================

        const attachResponse =
          await fetch(
            `${WORKER_URL}/attach-qr`,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                paymentIntentId:
                  paymentIntentId,

                clientKey:
                  clientKey

              })

            }
          );


        const attachData =
          await attachResponse.json();


        console.log(
          "Attach QR:",
          attachData
        );


        if (!attachResponse.ok) {

          throw new Error(
            attachData.error ||
            "Failed to attach QR"
          );

        }


        // =================================
        // STEP 3
        // GET QR IMAGE
        // =================================

        const qrImage =
          attachData.data.attributes
            .next_action.code.image_url;


        // =================================
        // STEP 4
        // DISPLAY QR
        // =================================

        document.getElementById(
          "qr"
        ).innerHTML = `

          <img
            src="${qrImage}"
            alt="Pay ₱${product.price}"
          >

        `;


        document.getElementById(
          "status"
        ).textContent =
          "Scan this QR code to pay.";


        // =================================
        // STEP 5
        // CHECK PAYMENT
        // =================================

        const checkPayment =
          setInterval(
            async () => {

              try {

                const response =
                  await fetch(
                    `${WORKER_URL}/check-payment`,
                    {

                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                      body: JSON.stringify({

                        paymentIntentId:
                          paymentIntentId

                      })

                    }
                  );


                const data =
                  await response.json();


                const status =
                  data?.data?.attributes?.status;


                console.log(
                  "Payment status:",
                  status
                );


                // =================================
                // PAYMENT SUCCESS
                // =================================

                if (
                  status === "succeeded"
                ) {

                  clearInterval(
                    checkPayment
                  );


                  document.getElementById(
                    "status"
                  ).textContent =
                    "Payment successful!";


                  document.getElementById(
                    "qr"
                  ).innerHTML =
                    "";


                  document.getElementById(
                    "backButton"
                  ).style.display =
                    "inline-block";

                }

              } catch (error) {

                console.error(
                  "Payment check failed:",
                  error
                );

              }

            },
            3000
          );


      } catch (error) {

        console.error(
          error
        );


        document.getElementById(
          "status"
        ).textContent =
          "Failed to create payment: " +
          error.message;


        document.getElementById(
          "backButton"
        ).style.display =
          "inline-block";

      }

    }


    // =================================
    // RETURN TO PRODUCT LIST
    // =================================

    function showProducts() {

      document.getElementById(
        "payment"
      ).style.display =
        "none";


      document.getElementById(
        "products"
      ).style.display =
        "block";


      document.getElementById(
        "subtitle"
      ).style.display =
        "block";


      document.getElementById(
        "backButton"
      ).style.display =
        "none";


      document.getElementById(
        "status"
      ).textContent =
        "";

    }


    // =================================
    // START
    // =================================

    loadProducts();

  </script>

</body>
</html>
